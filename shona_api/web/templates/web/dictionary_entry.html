{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shona Dictionary Entry</title>
    <link rel="stylesheet" href="{% static 'web/dictionary-search.css' %}">
    <script src="{% static 'web/dictionary-entry.js' %}" defer></script>
  </head>
  <body>
    <main
      class="dictionary-shell entry-shell"
      data-lemma-public-id="{{ lemma_public_id }}"
      data-lemma-endpoint="{{ lemma_endpoint }}"
      data-entry-url-template="{{ entry_url_template }}"
      data-tsumo-endpoint="{{ tsumo_endpoint }}"
      data-madimikira-endpoint="{{ madimikira_endpoint }}"
      data-api-key-storage="shona-api.reference-web.api-key"
    >
      <section class="search-panel entry-panel" aria-labelledby="dictionary-title">
        <div class="entry-nav">
          <a class="text-link" href="{{ search_url }}">Search</a>
        </div>
        <div class="masthead">
          <p class="eyebrow">Reference Web Dictionary</p>
          <h1 id="dictionary-title">Shona Dictionary</h1>
          <p class="lede">Entry record <span class="mono">{{ lemma_public_id }}</span></p>
        </div>

        <details class="api-key-panel" data-api-key-panel>
          <summary>API access</summary>
          <label class="field-label" for="api-key">API key</label>
          <div class="api-key-row">
            <input
              id="api-key"
              class="api-key-input"
              name="api-key"
              type="password"
              autocomplete="off"
              placeholder="shona_sk_..."
              data-api-key-input
            >
            <button class="secondary-button" type="button" data-save-key>Save</button>
            <button class="ghost-button" type="button" data-clear-key>Clear</button>
          </div>
        </details>
      </section>

      <section class="results-panel entry-results" aria-live="polite" aria-busy="false">
        <div data-entry-region>
          <div class="state-card">
            <h2>Loading</h2>
            <p>Fetching the public lemma API.</p>
          </div>
        </div>
        <div data-related-region></div>
        <details class="raw-json-panel" data-json-panel hidden>
          <summary>Raw JSON</summary>
          <pre class="raw-json mono" data-json-output></pre>
        </details>
      </section>
    </main>
  </body>
</html>
